# Sistema de islas (estilo Apple): fondo gris, islas blancas (claro) o gris oscuro sobre negro (oscuro). Un solo azul de acento.
# Sin [theme] global: así Streamlit sigue el modo del sistema (Auto); el selector Claro/Oscuro/Auto del panel sincroniza la clave nativa.
[theme.light]
primaryColor = "#0B63CE"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#F2F2F7"
textColor = "#1D1D1F"
linkColor = "#0B63CE"
borderColor = "#E5E5EA"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = false

[theme.dark]
primaryColor = "#0B63CE"
backgroundColor = "#000000"
secondaryBackgroundColor = "#2C2C2E"
textColor = "#F5F5F7"
linkColor = "#64A8FF"
borderColor = "#38383A"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = false

[client]
# "viewer" quita el botón Deploy (herramienta local, sin despliegue) y deja solo el menú ⋮
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
